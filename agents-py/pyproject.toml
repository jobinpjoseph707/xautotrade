[project]
name = "xautotrade-agents"
version = "0.1.0"
description = "The agent service: Doctor, Optimizer, Tester, Critic and Risk Guard as one LangGraph run. It can read, test and propose; it cannot trade or change a strategy."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["agents_py"]
